# Fails the build when a model your code calls has gone away.
#
# Runs on every push and once a day, because the interesting case is not "did
# this PR add a dead model" - it is "did a model you already shipped disappear
# overnight". That happens without an announcement, which is the whole reason
# this check exists.
name: model check

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check for models that are gone or shutting down
        run: |
          curl -sO https://neosignal-ai.vercel.app/check.py
          python check.py . --quiet
