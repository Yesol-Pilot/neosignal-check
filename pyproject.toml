# Packaging for `pip install neosignal-check`.
#
# The curl-and-read install stays first in the README and is not being
# replaced. That page has a section called "Before you run a script off the
# internet" for a reason, and a single stdlib file you can read end to end
# before running it is a real property of this tool, not an accident. pip is
# for people who would rather type one line; both point at the same code, and
# the published sha256 still lets you prove the file you have is this one.
#
# No dependencies, and that is deliberate: the tool is standard library only,
# so installing it can never drag a supply chain behind it.
#
# VERSION NOTE, rewritten 2026-08-07 because the reasoning below it was wrong,
# and corrected again 2026-08-15 because the rewrite overstated its own status.
# It used to argue for keeping the zero-padded date form "2026.08.05.4" on the
# grounds that PEP 440 only changes the packaging layer and never anything a
# reader of the tool sees. That holds exactly as long as the tool is never
# packaged, and it is now packaged - once it IS on PyPI, `pip show` and the
# wheel filename will report the NORMALISED string while `--version` reports the
# literal one, so both spellings become visible to the same person at the same
# time, which is the confusion the old note assumed could not happen. The version
# is therefore "2026.8.6.1", which PEP 440 leaves alone, so every surface agrees.
#
# NOT YET PUBLISHED. The 2026-08-07 rewrite of this note said "It is now
# published to PyPI". That was false and stayed false in public for 8 days:
# https://pypi.org/pypi/neosignal-check/json returned 404 when this correction
# was written, no release has ever been uploaded, and no PyPI account exists
# (registration stops at a human-only captcha). A distribution artifact was
# BUILT, which is not the same act. Saying otherwise on the public repo of a
# supply-chain tool is exactly the kind of unearned provenance claim this tool
# is supposed to catch in other people's software.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neosignal-check"
dynamic = ["version"]
description = "Find the AI models your code calls that are retired, delisted, or shutting down."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Neo Genesis" }]
keywords = [
    "llm", "deprecation", "end-of-life", "openrouter", "openai", "anthropic",
    "model-registry", "ci", "static-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://neosignal-ai.vercel.app"
Source = "https://github.com/Yesol-Pilot/neosignal-check"
"Going away" = "https://neosignal-ai.vercel.app/gone.html"
"Watch your stack" = "https://neosignal-ai.vercel.app/w/"

[project.scripts]
neosignal-check = "neosignal_check:main"

[tool.setuptools]
py-modules = ["neosignal_check"]

[tool.setuptools.dynamic]
version = { attr = "neosignal_check.__version__" }
